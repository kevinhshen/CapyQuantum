</style></head><body><div id="app"><p class="loading" role="status">Preparing Qubit Tempo…</p></div><script type="module">// Standalone rhythm rules and five-qubit circuit model. Mirrors quantum/rhythm.py.

  for (let q = 0; q < 3; q++) if (fix >> q & 1) g('x', q);

  if (state === '+i') g('sdg', 0);
