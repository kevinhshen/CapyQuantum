<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qubit Tempo · CapyQuantum</title><style>:root {
  font-family:Georgia,'Times New Roman',serif;
  color:#34483b;
  background:#b7c99a;
  font-synthesis:none;
  --cream:#fff9e9;
  --ink:#34483b;
  --muted:#758573;
  --green:#476b47;
  --line:#cbd5ac;
  --peach:#e9ad85
}
* {
  box-sizing:border-box
}
body {
  margin:0
}
button,select,input {
  font:inherit;
  color:inherit
}
button {
  cursor:pointer
}
button:disabled {
  cursor:wait;
  opacity:.5
}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible {
  outline:3px solid #476b47;
  outline-offset:4px
}
button {
  border:1px solid var(--line);
  background:var(--cream);
  border-radius:12px;
  transition:background .15s,transform .15s
}
button:hover {
  background:#f2edda
}
button:active {
  transform:translateY(1px)
}
[hidden] {
  display:none!important
}
.garden-game {
  height:100dvh;
  min-height:630px;
  overflow:hidden;
  position:relative
}
#garden {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none
}
.hud {
  position:absolute;
  top:28px;
  left:38px;
  right:38px;
  display:flex;
  gap:26px;
  align-items:center;
  z-index:5
}
.brand {
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:var(--ink);
  font-size:29px;
  line-height:1
}
.brand em {
  font-weight:normal
}
.brand-flower {
  font-size:39px;
  color:#587846
}
.brand small {
  display:block;
  font:8px/1.5 ui-monospace,monospace;
  letter-spacing:1.2px;
  margin-top:8px
}
.song-label {
  margin-left:auto;
  display:flex;
  flex-direction:column;
  text-align:right;
  gap:5px
}
.song-label b {
  font-size:17px;
  font-weight:normal
}
.song-label span {
  font:10px ui-monospace,monospace;
  color:#536b48
}
.score-pill {
  background:#fff9e9cc;
  border:1px solid #fcf4d6;
  border-radius:14px;
  padding:10px 18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  box-shadow:0 3px 0 #49652d15
}
.score-pill b {
  font:21px ui-monospace,monospace;
  letter-spacing:1px
}
.score-pill small {
  font:8px ui-monospace,monospace;
  letter-spacing:1.8px
}
.hud nav {
  display:flex;
  gap:7px
}
.hud nav button {
  width:36px;
  height:36px;
  font:18px Georgia;
  background:#fff9e9b8
}
.song-progress {
  position:absolute;
  left:38px;
  right:38px;
  top:98px;
  height:3px;
  background:#66864b25;
  z-index:4;
  border-radius:4px
}
.song-progress i {
  display:block;
  width:0;
  height:100%;
  background:#fff9e9;
  border-radius:4px
}
.deck {
  --lanes:3;
  --deck-width:405px;
  position:absolute;
  width:min(var(--deck-width),55vw);
  top:127px;
  bottom:60px;
  left:calc(50% - 200px);
  transform:translateX(-50%);
  transition:left .5s,width .3s;
  z-index:2
}
.highway {
  position:absolute;
  inset:0 0 30px;
  background:linear-gradient(180deg,#fff9e928,#fff9e978 55%,#fdf6e7dd);
  border:1px solid #fff9e990;
  border-top:0;
  border-radius:22px 22px 34px 34px;
  box-shadow:0 24px 60px #46623625,0 6px 0 #5d733019;
  overflow:hidden
}
.lane-grid {
  display:grid;
  grid-template-columns:repeat(var(--lanes),1fr);
  position:absolute;
  inset:0
}
.lane {
  border-right:1px solid #70885e22;
  position:relative
}
.lane:last-child {
  border:0
}
.lane span {
  display:block;
  text-align:center;
  margin-top:20px;
  font:9px ui-monospace,monospace;
  letter-spacing:2px;
  color:#718365
}
.highway-grain {
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 50px,#fff9e912 51px);
  pointer-events:none
}
.hit-line {
  position:absolute;
  left:0;
  right:0;
  bottom:92px;
  height:3px;
  background:#536f3b;

  z-index:2
}
.hit-line span {

  top:7px;
  left:8px;
  font:7px ui-monospace,monospace;
  letter-spacing:1.8px;
  color:#81906e
}
.receptors {
  position:absolute;
  bottom:20px;
  left:0;
  right:0;
  display:grid;
  grid-template-columns:repeat(var(--lanes),1fr);
  gap:6px;
  padding:0 10px;
  z-index:4
}
.receptors button {
  height:55px;
  border:1px solid #b8c697;
  background:#fff9e9c9;
  border-radius:15px;
  box-shadow:0 4px 0 #64774525
}
.receptors span {
  font:18px ui-monospace,monospace
}
.receptors small {
  display:block;
  font:7px ui-monospace,monospace;
  letter-spacing:1px;
  margin-top:4px;
  color:#7d8e6b
}
.receptors button.pressed {
  background:#e9ad85;
  box-shadow:0 0 22px #e9ad8577;
  transform:translateY(3px)
}
.notes {
  position:absolute;
  inset:0;
  pointer-events:none
}
.falling-note {
  position:absolute;
  left:calc(var(--lane)*100%/var(--lanes) + 8px);
  width:calc(100%/var(--lanes) - 16px);
  height:24px;
  margin-top:-12px;
  background:#e9ad85;
  border:1px solid #faf0ce;
  border-radius:10px;
  box-shadow:0 3px 0 #986b4b44,0 0 20px #e9ad8533;
  text-align:center;
  color:#fff9e9;
  will-change:transform
}
.falling-note span {
  font-size:20px;
  line-height:21px
}
.falling-note.chord-note {
  background:#98b17e;
  box-shadow:0 3px 0 #536f3b55;
  border-color:#e6ecc7
}
.falling-note small {
  position:absolute;
  top:1px;
  right:5px;
  font:9px ui-monospace,monospace;
  color:#34483b
}
.preview-note {
  opacity:.85
}
.judgement {
  position:absolute;
  top:52%;
  width:100%;
  text-align:center;
  font-style:italic;
  font-size:27px;
  color:#476b47;
  pointer-events:none;
  z-index:5
}
.judgement[data-kind=stray] {
  color:#986b4b
}
.combo-display {
  position:absolute;
  top:63%;
  width:100%;
  text-align:center;
  pointer-events:none
}
.combo-display b {
  display:block;
  font:52px Georgia;
  color:#536d3e55
}
.combo-display span {
  font:8px ui-monospace,monospace;
  letter-spacing:2px;
  color:#6f845960
}
.count-in {
  position:absolute;
  top:34%;
  width:100%;
  text-align:center;
  font:90px Georgia;
  color:#476b47;
  pointer-events:none
}
.deck-caption {
  position:absolute;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  gap:10px;
  font:9px ui-monospace,monospace;
  color:#4b633e
}
.map-letter {
  position:absolute;
  z-index:3;
  left:calc(50% + 66px);
  top:140px;
  width:325px;
  background:var(--cream);
  border:1px solid #e8e1c6;
  box-shadow:0 14px 45px #49652d20,0 5px 0 #6e7d4222;
  border-radius:4px 22px 22px 22px;
  padding:28px 28px 20px;
  transform:rotate(1deg)
}
.eyebrow {
  font:8px ui-monospace,monospace;
  letter-spacing:1.8px;
  color:#798666;
  margin-bottom:18px
}
.letter-stamp {
  position:absolute;
  right:23px;
  top:30px;
  border:1px dashed #bec997;
  border-radius:8px;
  padding:4px 9px;
  font:27px Georgia;
  color:#9ea67c;
  transform:rotate(-9deg)
}
h1 {
  font-size:38px;
  line-height:1.05;
  letter-spacing:-1.5px;
  font-weight:normal;
  margin:0 0 15px
}
h1 em {
  color:#658252
}
.map-letter p {
  font-size:12px;
  line-height:1.6;
  color:#758573;
  margin:0 0 20px
}
.field {
  display:block;
  font:8px ui-monospace,monospace;
  letter-spacing:1.5px;
  color:#758573;
  margin-top:14px
}
.field select {
  display:block;
  width:100%;
  margin-top:7px;
  border:0;
  border-bottom:1px solid #cbd5ac;
  background:transparent;
  padding:6px 0 9px;
  font:14px Georgia;
  letter-spacing:0;
  border-radius:0
}
.map-info {
  display:flex;
  justify-content:space-between;
  margin:14px 0 19px;
  font:9px ui-monospace,monospace;
  color:#758573
}
.primary {
  background:#476b47;
  color:#fff9e9;
  border-color:#476b47;
  padding:13px 17px;
  box-shadow:0 3px 0 #344d3033;
  text-align:left;
  font-size:14px
}
.primary:hover {
  background:#3b5b3b
}
.map-letter .primary {
  width:100%;
  display:flex;
  justify-content:space-between
}
.text-button {
  background:transparent;
  border:0;
  font:10px Georgia;
  color:#758573;
  padding:11px 0;
  display:block;
  width:100%;
  text-align:center;
  box-shadow:none
}
.text-button:hover {
  background:transparent;
  color:#476b47;
  text-decoration:underline
}
.author-actions {
  display:flex;
  gap:8px;
  margin:8px 0
}
.author-actions button {
  flex:1;
  padding:7px 0;
  font:10px ui-monospace,monospace;
  border-radius:8px
}
.music-name {
  font:8px ui-monospace,monospace;
  display:block;
  color:#758573;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}
.map-letter .runtime-note {
  font:8px/1.5 ui-monospace,monospace;
  margin:13px 0 0;
  text-align:center;
  color:#7c896a
}
.bottom-note {
  position:absolute;
  bottom:19px;
  left:38px;
  right:38px;
  display:flex;
  justify-content:space-between;
  font:8px ui-monospace,monospace;
  letter-spacing:.3px;
  color:#526c42;
  z-index:4
}
.practice-hint {
  position:absolute;
  left:50%;
  top:112px;
  transform:translateX(-50%);
  z-index:6;
  background:#fff9e9ed;
  border:1px solid #cbd5ac;
  border-radius:16px;
  padding:12px 20px;
  max-width:80vw;
  box-shadow:0 5px 25px #49652d20;
  display:flex;
  align-items:center;
  gap:12px
}
.practice-hint>span {
  color:#e9ad85;
  font-size:28px
}
.practice-hint p {
  font-size:12px;
  line-height:1.5;
  max-width:340px;
  margin:0
}
.practice-hint button {
  padding:8px;
  white-space:nowrap;
  font-size:11px
}
.garden-game[data-state=playing] .deck,.garden-game[data-state=practice] .deck,.garden-game[data-state=result] .deck {
  left:50%;
  width:min(var(--deck-width),76vw)
}
.garden-game:not([data-state=menu]) .map-letter {
  display:none
}
.garden-game[data-state=menu] .score-pill {
  opacity:.6
}
.garden-game[data-state=result] .combo-display {
  opacity:.3
}
dialog {
  max-width:590px;
  width:calc(100% - 34px);
  max-height:90dvh;
  overflow:auto;
  border:1px solid #e5dfc2;
  border-radius:24px;
  background:var(--cream);
  color:var(--ink);
  padding:34px;
  box-shadow:0 25px 100px #2f482e40
}
dialog::backdrop {
  background:#34483b50;
  backdrop-filter:blur(7px)
}
h2 {
  font-size:31px;
  font-weight:normal;
  line-height:1.12;
  letter-spacing:-.8px;
  margin:0 0 19px
}
h2 em {
  display:block;
  font-size:19px;
  letter-spacing:-.3px;
  color:#758573;
  margin-top:9px
}
dialog p {
  font-size:13px;
  line-height:1.7;
  color:#64765e
}
#dialog-actions {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:23px
}
#dialog-actions .primary {
  flex:1
}
.subtle {
  padding:11px 14px;
  font-size:12px;
  background:#f6f1de
}
.result-title {
  display:flex;
  gap:20px;
  align-items:center;
  justify-content:space-between
}
.grade {
  font:70px Georgia;
  color:#658252
}
.result-stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid #d4dbb9;
  border-bottom:1px solid #d4dbb9;
  margin-top:8px;
  padding:20px 0;
  gap:12px
}
.result-stats b {
  display:block;
  font:29px Georgia
}
.result-stats small {
  font:7px ui-monospace,monospace;
  letter-spacing:1px;
  color:#7b896b;
  display:block;
  margin-top:7px
}
.judgement-row {
  display:flex;
  justify-content:space-between;
  margin-top:22px;
  font:9px ui-monospace,monospace;
  color:#758573;
  gap:10px
}
.judgement-row b {
  display:block;
  font:19px Georgia;
  color:#476b47;
  margin-bottom:5px
}
.timing-chart {
  margin:13px 0 20px
}
.timing-chart svg {
  display:block;
  width:100%;
  height:82px
}
.timing-chart>div {
  display:flex;
  justify-content:space-between;
  font:8px ui-monospace,monospace;
  color:#758573
}
.result-insight {
  padding:11px 14px;
  background:#e8edcf80;
  border-radius:10px
}
details {
  font-size:12px;
  color:#64765e;
  margin-top:19px
}
summary {
  cursor:pointer
}
details p {
  font-size:11px
}
.tune-field {
  display:block;
  font-size:13px;
  margin:20px 0
}
.tune-field input {
  width:100%;
  display:block;
  accent-color:#476b47;
  margin:13px 0
}
.tune-field span {
  font:10px ui-monospace,monospace;
  color:#758573
}
.check-field {
  display:flex;
  gap:8px;
  align-items:center;
  font-size:13px
}
.check-field input {
  accent-color:#476b47
}
.sr-only {
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0
}
.loading {
  margin:30px;
  font-style:italic
}
@media(min-width:1500px) {
  .deck {
    left:calc(50% - 170px)
  }
  .map-letter {
    left:calc(50% + 115px)
  }
}
@media(max-height:780px) and (min-width:821px) {
  .map-letter {
    top:118px;
    padding:21px 25px;
    width:310px
  }
  .map-letter h1 {
    font-size:31px
  }
  .map-letter p {
    margin-bottom:10px
  }
  .field {
    margin-top:9px
  }
  .map-info {
    margin:10px 0
  }

  }

    bottom:51px
  }
}
@media(max-width:820px) {
  .garden-game {
    min-height:650px
  }
  .hud {
    top:18px;
    left:18px;
    right:18px;
    gap:12px
  }
  .brand {
    font-size:22px
  }
  .brand-flower {
    font-size:29px
  }
  .brand small {
    font-size:6px;
    letter-spacing:.4px
  }
  .song-label {
    display:none
  }
  .score-pill {
    margin-left:auto;

  }
  .score-pill b {
    font-size:16px
  }
  .hud nav {
    gap:4px
  }
  .hud nav button {
    width:30px;
    height:30px
  }
  .song-progress {
    top:82px;
    left:18px;
    right:18px
  }
  .deck {
    left:50%;
    top:102px;
    bottom:35px;

  }
  .garden-game[data-state=menu] .deck {
    left:25%;
    width:40vw;
    opacity:.65
  }
  .map-letter {
    top:115px;

    right:18px;
    width:min(325px,70vw);

  }
  .bottom-note {
    bottom:11px;
    left:18px;
    right:18px;
    font-size:6px
  }
  .bottom-note span:last-child {
    display:none
  }
  .garden-game[data-state=playing] .deck,.garden-game[data-state=practice] .deck,.garden-game[data-state=result] .deck {
    width:92vw
  }
  .deck-caption {
    font-size:8px
  }
  .receptors {
    gap:4px;
    padding:0 6px

  .receptors span {
    font-size:15px
  }
  .falling-note {
    left:calc(var(--lane)*100%/var(--lanes) + 5px);
    width:calc(100%/var(--lanes) - 10px)

  .practice-hint {
    top:100px;
    padding:10px 14px;
    max-width:90vw;
    width:max-content
  }
  .practice-hint p {
    max-width:240px
  }
  .practice-hint button {
    white-space:normal
  }
  dialog {
    padding:25px
  }
  .result-stats b {
    font-size:24px
  }
  .result-stats small {
    font-size:6px
  }
  .result-title h2 {
    font-size:27px
  }
  .grade {
    font-size:58px
  }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    transition:none!important;
    scroll-behavior:auto!important
  }
}
@media(max-width:420px) {
  .hud {
    gap:8px
  }
  .brand {
    font-size:18px;
    gap:6px
  }
  .brand-flower {
    font-size:22px
  }
  .brand small {
    display:none
  }
  .score-pill {
    padding:6px 8px
  }
  .score-pill b {
    font-size:14px
  }
  .hud nav button {
    width:28px;
    height:30px
  }
}
.error-packet{position:absolute;left:2%;width:96%;height:66px;border:1px solid #d9ddba;border-radius:15px;background:#fff9e9ef;box-shadow:0 4px 0 #536f3b22;will-change:transform}
.packet-tag{text-align:center;font:7px ui-monospace,monospace;letter-spacing:1.2px;color:#7c896a;margin:7px 0 4px}
.packet-register{position:relative;display:grid;grid-template-columns:repeat(var(--lanes),1fr);align-items:center;height:41px}
.packet-qubit{text-align:center;font:23px Georgia;color:#8caa74;line-height:20px}.packet-qubit small{display:block;font:7px ui-monospace,monospace;color:#758573;margin-top:3px}.packet-qubit.applied{color:#bd936c}
.parity-lamp{position:absolute;top:0;transform:translateX(-50%);width:22px;height:22px;display:grid;place-items:center;border:1px solid #c3cda1;border-radius:50%;font:bold 17px Georgia;color:#7b8a68;background:#eef1dd;z-index:1}
.parity-lamp[data-alert="1"]{background:#f5d4b6;border:2px solid #bd805d;color:#825738}.choice-result{font:11px ui-monospace,monospace!important;color:#476b47!important}
@media(max-width:420px){.parity-lamp{width:19px;height:19px;font-size:15px}.packet-qubit{font-size:19px}.packet-tag{font-size:6px}}
/* Page-based player: the chart only appears during a run. */
:root{font-family:ui-rounded,'Avenir Next',system-ui,sans-serif;--muted:#53654c}
.garden-game{min-height:640px;background:#e8edd6}
#garden{opacity:.48}
.hud{top:25px}.brand{font-family:Georgia,serif}.brand small{font-size:9px;letter-spacing:1px}
.page{position:absolute;inset:110px 7% 75px;z-index:3;overflow-y:auto;scrollbar-width:thin;padding:12px 4px}
.page h1,.page h2{font-family:Georgia,serif;font-weight:normal;color:#34483b;margin:0}
.page h1{font-size:45px;line-height:1.15}.page h2{font-size:32px}
.page p{line-height:1.65;font-size:15px}.page .eyebrow{font:10px ui-monospace,monospace;letter-spacing:1.8px;color:#4b6342;margin-bottom:14px}
.home-page{display:grid;grid-template-columns:1.1fr 1fr;gap:7%;align-items:center;max-width:1120px;margin:auto}

  constructor(canvas) { this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.particles = []; this.blooms = 0; this.palette = 0; this.resize(); }
  resize() { const r = this.canvas.getBoundingClientRect(), ratio = Math.min(devicePixelRatio || 1, 2); this.w = r.width; this.h = r.height; this.canvas.width = r.width * ratio; this.canvas.height = r.height * ratio; this.ctx.setTransform(ratio, 0, 0, ratio, 0, 0); }
  ellipse(x, y, rx, ry, color) { const c = this.ctx; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fillStyle = color; c.fill(); }
  tree(x, y, size, variant = 0) {
    const c = this.ctx; this.ellipse(x, y + size * .65, size * .52, size * .14, '#55734b28');
    c.fillStyle = '#a79066'; c.fillRect(x - size * .055, y, size * .11, size * .62);
    this.ellipse(x, y - size * .2, size * .5, size * .58, variant ? '#829e70' : '#75956c');
    this.ellipse(x - size * .2, y - size * .08, size * .36, size * .37, variant ? '#96ae7b' : '#87a577');
    this.ellipse(x + size * .14, y - size * .36, size * .32, size * .36, '#a2b888');
  }
  flower(x, y, size, color) {
    const c = this.ctx; c.strokeStyle = '#729368'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 2, y + size * 2.4); c.stroke();
    for (let n = 0; n < 5; n++) { const a = n * Math.PI * 2 / 5; this.ellipse(x + Math.cos(a) * size * .6, y + Math.sin(a) * size * .6, size * .55, size * .55, color); }
    this.ellipse(x, y, size * .35, size * .35, '#fff1bd');
  }
  burst(x, y, lane) { this.blooms++; for (let i = 0; i < 7; i++) this.particles.push({ x, y, vx: (Math.random() - .5) * 100, vy: -35 - Math.random() * 60, life: .65, lane }); }
  draw(dt, beat = 0, reduced = false) {
    const c = this.ctx, w = this.w, h = this.h;
    c.fillStyle = this.palette % 2 ? '#b9cda0' : '#b7c99a'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#f2eed055'; c.beginPath(); c.ellipse(w * .12, h * .25, w * .42, h * .4, -.3, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#95ad8050'; c.beginPath(); c.ellipse(w * .92, h * .65, w * .38, h * .52, .3, 0, Math.PI * 2); c.fill();
    this.ellipse(w * .16, h * .65, w * .14, h * .13, '#8eab8425');
    this.ellipse(w * .13, h * .73, Math.min(95, w * .1), 39, '#7ba59b');
    this.ellipse(w * .13, h * .72, Math.min(88, w * .09), 31, '#a6c8b0');
    this.ellipse(w * .13, h * .72, Math.min(75, w * .075), 24, '#92bca9');
    c.strokeStyle = '#d5e0bc'; c.lineWidth = 2; c.beginPath(); c.ellipse(w * .13, h * .72, Math.min(50, w * .05), 12, 0, 0, Math.PI * 2); c.stroke();
    for (let i = 0; i < 12; i++) {
      const side = i % 2, x = side ? w * (.87 + Math.sin(i * 4) * .07) : w * (.08 + Math.sin(i * 4) * .06);
      const y = h * (.2 + (i % 6) * .13); this.tree(x, y, 30 + (i % 3) * 9, i % 2);
    }
    for (let i = 0; i < 68; i++) {
      const x = ((i * 313.7) % 997) / 997 * w, y = ((i * 197.3) % 983) / 983 * h;
      if (x > w * .28 && x < w * .72) continue;
      this.flower(x, y, 2.5 + i % 3, ['#e4b5a3', '#f0dfad', '#d0c2d8'][i % 3]);
    }
    // Garden growth responds to successful corrections.
    for (let i = 0; i < Math.min(this.blooms, 45); i++) this.flower(w * (.79 + (i % 5) * .028), h * (.67 + Math.floor(i / 5) * .018), 3.5, '#f1c7a5');
    const bob = reduced ? 0 : Math.sin(beat * Math.PI) * 2;
    this.ellipse(w * .17, h * .52 + 16, 29, 9, '#49684125');
    this.ellipse(w * .17, h * .52 + bob, 28, 20, '#d5ad83');
    this.ellipse(w * .17 + 18, h * .52 - 7 + bob, 17, 16, '#e5c59e');
    this.ellipse(w * .17 + 18, h * .52 - 22 + bob, 5, 6, '#caa17b');
    this.ellipse(w * .17 + 23, h * .52 - 9 + bob, 2, 2, '#415a42');
    this.ellipse(w * .17 + 33, h * .52 + bob, 4, 2, '#836a4d');
    if (!reduced) {
      this.particles = this.particles.filter(p => p.life > 0);
      for (const p of this.particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 110 * dt; c.globalAlpha = Math.max(0, p.life / .65); this.ellipse(p.x, p.y, 4, 2, ['#f7ead0', '#e9b391', '#cadbb7'][p.lane % 3]); }
      c.globalAlpha = 1;
    } else this.particles = [];
  }
}

      }
    });
